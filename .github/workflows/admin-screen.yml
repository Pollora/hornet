name: Admin screen

# The Tools > Security screen is compiled (npm run build) and the result, assets/admin, is tracked: nothing runs npm on a site.
# This workflow keeps the two honest: what is tracked is what the source builds to, and the source's own tests pass.

on:
  push:
    branches: [main]
    paths: ['admin/**', 'assets/**', 'languages/**', 'package.json', 'package-lock.json', '.github/workflows/admin-screen.yml']
  pull_request:
    paths: ['admin/**', 'assets/**', 'languages/**', 'package.json', 'package-lock.json', '.github/workflows/admin-screen.yml']
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: The compiled screen is the one the source builds
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install exactly what the lock file says
        run: npm ci --no-audit --no-fund
      - name: Unit tests of the screen
        run: npm test
      - name: Build, and refuse a tracked build that is not this one
        run: |
          npm run build
          git diff --exit-code -- assets/admin || { echo "::error::assets/admin is not what admin/src builds to: run npm run build and commit the result"; exit 1; }
          test -z "$(git status --porcelain -- assets/admin)" || { echo "::error::npm run build made a file that is not tracked"; git status --porcelain -- assets/admin; exit 1; }
      - name: The translations are complete, and are what the source and the .po files give
        run: npm run i18n:check
      - name: Audit what ships to the browser
        run: npm audit --omit=dev
