name: Harness

on:
  push:
    branches: [main]
  pull_request:
    # A label (api-change, breaking) changes what the public surface gate allows.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  harness:
    uses: Pollora/harness/.github/workflows/php-package.yml@e3b0f63f04dddfae7eea54d30d7afc3df5a8a931
    with:
      wordpress-integration: tests/Integration
      wordpress-plugins: two-factor
    permissions:
      contents: read
